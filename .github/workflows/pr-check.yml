name: Check PR
on:
  pull_request:
    branches: [main]
# Analyze and test only: no reason to write to the repository.
permissions:
  contents: read
jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned: newer Flutter releases break extended_text_field and
      # simple_icons and deprecate APIs the code still uses.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
          cache: true
      - run: flutter doctor -v
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
