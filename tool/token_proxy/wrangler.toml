# Only for deploying with Wrangler (the Cloudflare CLI) or Cloudflare's Git
# integration. The dashboard setup in README.md does not need this file.
#
# No secrets here, ever. TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET are
# Cloudflare secrets, set in the dashboard (Settings > Variables and Secrets)
# or with `wrangler secret put TWITCH_CLIENT_SECRET`.
#
# Careful: a Wrangler deploy replaces the bindings set in the dashboard with
# the ones below (secrets are kept). Uncomment the KV block first if the
# dashboard has a TOKEN_CACHE binding.

name = "onset-token"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Per-IP limit enforced by Cloudflare (approximate, per Cloudflare location).
# It cannot be added from the dashboard; without it the Worker falls back to
# a best-effort counter in each isolate. namespace_id is any integer unique
# to the Cloudflare account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4201"

  [ratelimits.simple]
  limit = 10
  period = 60

# Shares one Twitch token between all of Cloudflare's machines. Create the
# namespace (dashboard: Storage & Databases > Workers KV), then put its id
# here and uncomment. The id is not a secret.
# [[kv_namespaces]]
# binding = "TOKEN_CACHE"
# id = "<your KV namespace id>"
